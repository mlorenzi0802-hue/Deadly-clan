<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deadly Clan</title>

  <!-- Modern Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=League+Spartan:wght@300;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: 'League Spartan', sans-serif;
      overflow-x: hidden;
    }

    /* Smooth fade-in animation */
    .fade {
      animation: fadeIn 1.2s ease forwards;
      opacity: 0;
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }

    header {
      text-align: center;
      padding: 40px 20px;
      border-bottom: 2px solid gold;
    }
    header h1 {
      font-family: 'Cinzel', serif;
      font-size: 60px;
      color: gold;
      letter-spacing: 4px;
      margin: 0;
    }
    header p {
      font-size: 18px;
      color: #ccc;
      margin-top: 10px;
    }

    .hero {
      text-align: center;
      padding: 60px 20px;
    }
    .hero img {
      width: 280px;
      margin-top: 20px;
      filter: drop-shadow(0 0 20px gold);
      transition: 0.4s;
    }
    .hero img:hover {
      transform: scale(1.05);
      filter: drop-shadow(0 0 30px red);
    }

    .section {
      max-width: 900px;
      margin: 0 auto;
      padding: 60px 20px;
      text-align: center;
    }
    .section h2 {
      font-family: 'Cinzel', serif;
      font-size: 36px;
      color: gold;
      margin-bottom: 20px;
    }
    .
